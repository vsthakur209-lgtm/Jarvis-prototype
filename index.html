<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18"><title>JARVIS — Holographic Assistant</title>
<style>
:root{color-scheme:dark;--cyan:#58eaff;--blue:#258cff;--pink:#ff64d8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 42%,#102b52 0,#071326 45%,#02050c 100%);color:#dffaff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center}
.app{width:min(100%,520px);min-height:100svh;padding:22px 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px}
header{width:100%;display:flex;justify-content:space-between;align-items:center;letter-spacing:.22em;font-size:12px;color:#8feeff}
.pill{border:1px solid #2a8ca8;border-radius:99px;padding:7px 11px;font-size:10px;letter-spacing:.12em;color:#9deeff}
.stage{width:100%;position:relative;display:grid;place-items:center;flex:1;min-height:440px;overflow:hidden}
.halo{position:absolute;width:min(88vw,390px);aspect-ratio:1;border:1px solid #36c9ff55;border-radius:50%;box-shadow:0 0 45px #168cff22,inset 0 0 45px #168cff22;animation:rotate 24s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;inset:18px;border:1px dashed #55dfff55;border-radius:50%}.halo:after{inset:44px;border-color:#e76aff44}
@keyframes rotate{to{transform:rotate(360deg)}}
.avatar{width:min(84vw,360px);height:390px;position:relative;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 18px #29bfff77)}
.avatar img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;opacity:.9;mask-image:linear-gradient(to bottom,transparent 0%,black 13%,black 82%,transparent 100%)}
.scan{position:absolute;left:7%;right:7%;height:2px;top:18%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 15px var(--cyan);opacity:.55;animation:scan 4s ease-in-out infinite}
@keyframes scan{0%,100%{top:18%}50%{top:76%}}
.brain{position:absolute;top:24%;width:76px;height:40px;border-radius:50%;background:#ff5cdb55;filter:blur(13px);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.55}}
.wave{position:absolute;bottom:19%;display:flex;gap:4px;align-items:center;height:42px;opacity:0;transition:.3s}
.wave i{width:3px;height:9px;border-radius:5px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.speaking .wave,.listening .wave{opacity:1}.speaking .wave i{animation:bars .5s ease-in-out infinite alternate}.speaking .wave i:nth-child(2n){animation-delay:.2s}.listening .wave i{animation:bars 1s ease-in-out infinite alternate}
@keyframes bars{to{height:35px}}
.caption{text-align:center;color:#9bdff0;font-size:12px;letter-spacing:.12em;min-height:18px}
.controls{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:1px solid #278db2;background:linear-gradient(145deg,#0b2948,#071326);color:#dffaff;border-radius:14px;padding:15px 12px;font-size:14px;font-weight:600;box-shadow:0 0 20px #168cff18}
button.primary{background:linear-gradient(135deg,#087da9,#164ca1);border-color:#65eaff}
button:active{transform:scale(.98)}button:disabled{opacity:.5}
input{width:100%;background:#071326;border:1px solid #245c7a;color:white;border-radius:12px;padding:14px;font-size:16px;outline:none}
form{width:100%;display:flex;gap:8px}form button{white-space:nowrap}
footer{font-size:10px;color:#6b9eae;text-align:center;line-height:1.5}
</style></head><body><main class="app" html,body,height 100 percent,margin 0 >

<form id="chat"><input id="message" placeholder="Talk to Jarvis…" autocomplete="off"><button class="primary">SEND</button></form>

<script>
const stage=document.querySelector('#stage'),statusEl=document.querySelector('#status'),caption=document.querySelector('#caption');
function mode(m,label){stage.className='stage '+m;statusEl.textContent=label;caption.textContent=label}
function speak(text){if(!('speechSynthesis'in window)){caption.textContent='Speech output is not supported in this browser.';return}
 mode('speaking','SPEAKING');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.onend=()=>mode('','STANDBY');speechSynthesis.speak(u)}
function respond(text){if(!text.trim())return;speak("I heard you say: "+text)}
document.querySelector('#chat').addEventListener('submit',e=>{e.preventDefault();respond(document.querySelector('#message').value);document.querySelector('#message').value=''});
document.querySelector('#stop').onclick=()=>{speechSynthesis.cancel();mode('','STANDBY')};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
document.querySelector('#listen').onclick=()=>{if(!SR){caption.textContent='Speech recognition is unavailable here. Use the text box or try a supported browser.';return}
 const r=new SR();r.lang='en-IN';r.interimResults=false;r.onstart=()=>mode('listening','LISTENING');r.onresult=e=>{const t=e.results[0][0].transcript;document.querySelector('#message').value=t;respond(t)};r.onerror=()=>mode('','MICROPHONE UNAVAILABLE');r.onend=()=>{if(statusEl.textContent==='LISTENING')mode('','STANDBY')};r.start()};
